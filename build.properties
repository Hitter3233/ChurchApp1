# Build Configuration for Church Hub Roku App

# Project settings
project.name=Church Hub
project.version=1.0.0
project.build=1

# Roku device configuration
roku.device.ip=192.168.1.100
roku.device.user=rokudev
roku.device.password=

# Build options
build.target=zip
build.verbose=false
build.compression=best

# Source directories
source.dir=src
components.dir=components
utils.dir=utils
images.dir=images
data.dir=data

# Output directory
output.dir=build

# Staging directory
staging.dir=staging

# Debug options
debug.enabled=false
debug.level=info

# Optimization
optimize=true
minify=true

# API Configuration - CHANGE THESE VALUES
api.base.url=https://api.yourchurch.com
api.timeout=30000
api.retry.attempts=3
api.retry.delay=1000

# Cache Configuration
cache.ttl=3600000
cache.enabled=true

# Feature flags
feature.offline.mode=true
feature.push.notifications=true
feature.analytics=true
